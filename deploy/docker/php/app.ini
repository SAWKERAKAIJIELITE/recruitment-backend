; PHP settings of the app image (docs/docker-deployment.md); the same values as deploy/php/ for a server without Docker.

; Uploads: imports up to 30 MB, documents 10 MB; imports, approvals and exports of 2,000 rows and more.
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 512M
max_execution_time = 180
; The application works in UTC and converts to REPORTS_TIMEZONE itself.
date.timezone = UTC
expose_php = Off
; Errors go to the logs, never to the response.
display_errors = Off
log_errors = On
; Laravel reads its settings from the container's environment (the .env file given to docker compose).
variables_order = EGPCS

; The code in an image never changes: PHP does not look for changed files. A new version is a new container.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
