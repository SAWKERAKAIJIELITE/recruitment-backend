; The PHP-FPM pool of the app container (read after the image's www.conf and zz-docker.conf, which it adjusts).
; The pool listens on port 9000 inside the compose network only; the web container (Caddy) is its one client.

[www]
; About 60 to 100 MB a worker on large imports and exports: 20 workers suit a server with 4 GB or more.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Keep the container's environment (the settings of .env) for the workers.
clear_env = no
; What PHP writes to stderr reaches `docker compose logs app`.
catch_workers_output = yes
decorate_workers_output = no
