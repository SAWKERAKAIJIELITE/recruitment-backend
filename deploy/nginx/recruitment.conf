# The recruitment system on one address (docs/deployment.md, step 9): the frontend's build at /, the API at /api.
# Install: sudo cp deploy/nginx/recruitment.conf /etc/nginx/sites-available/recruitment
#          then change server_name (both blocks) and the certificate paths, and enable it.

server {
    listen 80;
    server_name hr.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hr.example.local;

    ssl_certificate     /etc/ssl/recruitment/hr.crt;
    ssl_certificate_key /etc/ssl/recruitment/hr.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # The largest upload: candidate imports up to 30 MB (IMPORTS_MAX_FILE_KILOBYTES), documents 10 MB.
    client_max_body_size 34m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/recruitment.access.log;
    error_log  /var/log/nginx/recruitment.error.log;

    # The frontend, a single-page app: an unknown path is its index.html.
    root  /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. Only Laravel's front controller runs PHP; nothing else of the backend is served.
    location /api/ {
        root /var/www/recruitment/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        root /var/www/recruitment/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/recruitment.sock;
        # Large imports, approvals and exports take time (PHP's max_execution_time is 180 too).
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # No dotfiles (.env, .git) even if a root above is changed by mistake.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
