; OPcache for the recruitment backend (docs/deployment.md, step 8).
; Install: sudo cp deploy/php/90-recruitment.ini /etc/php/8.3/fpm/conf.d/90-recruitment.ini
; validate_timestamps=0: PHP does not look for changed files; every update ends with a reload of php8.3-fpm.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600
