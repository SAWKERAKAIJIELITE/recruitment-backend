; The recruitment backend's PHP-FPM pool (docs/deployment.md, step 8): its own user and socket.
; Install: sudo cp deploy/php/recruitment-fpm.conf /etc/php/8.3/fpm/pool.d/recruitment.conf

[recruitment]
user = recruitment
group = recruitment
listen = /run/php/recruitment.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; About 60 to 100 MB a worker on large imports and exports: 20 workers suit a server with 4 GB or more.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Uploads: imports up to 30 MB, documents 10 MB; imports, approvals and exports of 2,000 rows and more.
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size] = 34M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 180
; The application works in UTC and converts to REPORTS_TIMEZONE itself.
php_admin_value[date.timezone] = UTC
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /var/www/recruitment:/tmp:/usr/share/zoneinfo
; Errors go to the application's log (storage/logs), never to the response.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
